[project]
name = "vector-search-portability"
version = "0.1.0"
description = "Reproducible local vector search comparison with shared filter contracts"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.coverage.run]
branch = true
source = ["vector_portability"]
[tool.coverage.report]
show_missing = true
